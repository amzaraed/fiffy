<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha Invitation</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fffaf0;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: #fffcf7;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
            max-width: 400px;
        }
        h1 {
            color: #4b2e39;
        }
        .tulip {
            font-size: 50px;
            animation: float 1.5s infinite alternate ease-in-out;
        }
        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(-10px); }
        }
        p {
            color: #5c4033;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            background-color: #ff6b81;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff4757;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tulip">🌷</div>
        <h1>Hey Fiffy! 🍵</h1>
        <p>Let's go for that matcha experience we talked about!</p>
        <p>📍 <b>Softe, Menara Ilham</b></p>
        <p>📆 <b>This Friday, after work</b></p>
        <br>
        <p>Click below to confirm your attendance! 🚀</p>
        <br>
        <a class="btn" href="https://wa.me/601126203498?text=Confirming%20attendance!%20See%20you%20there!%20😊" target="_blank">Confirm Attendance</a>
        <br><br>
        <div class="tulip">🌷</div>
    </div>

</body>
</html>
